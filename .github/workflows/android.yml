name: Build Admin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build admin website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Configure release signing when signing secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_APPEND: |
            android {
              signingConfigs {
                release {
                  storeFile file("../release-signing.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                }
              }
            }
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/release-signing.keystore
            python3 -c 'import os; from pathlib import Path; p=Path("android/app/build.gradle"); p.write_text(p.read_text()+chr(10)+os.environ["GRADLE_APPEND"]+chr(10))'
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "Release signing secrets are not configured; building a debug APK for testing."
          fi
      - name: Build signed release APK
        if: env.BUILD_VARIANT == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Build debug APK
        if: env.BUILD_VARIANT != 'release'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload admin release APK
        if: env.BUILD_VARIANT == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: nyago-cargo-admin-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload admin debug APK
        if: env.BUILD_VARIANT != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: nyago-cargo-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
