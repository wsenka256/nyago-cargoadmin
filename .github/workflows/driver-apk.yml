name: Build Nyago Cargo Driver APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Prepare Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure release signing when signing secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_APPEND: |
            android {
              signingConfigs {
                release {
                  storeFile file("../release-signing.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                }
              }
            }
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/release-signing.keystore
            python3 -c 'import os; from pathlib import Path; p=Path("android/app/build.gradle"); p.write_text(p.read_text()+chr(10)+os.environ["GRADLE_APPEND"]+chr(10))'
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "Release signing secrets are not configured; building a debug APK for testing."
          fi
      - name: Build signed release APK
        if: env.BUILD_VARIANT == 'release'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Build debug APK
        if: env.BUILD_VARIANT != 'release'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish direct driver APK download
        if: env.BUILD_VARIANT == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nyago-cargo-driver --repo ${{ github.repository }} >/dev/null 2>&1 || gh release create nyago-cargo-driver --repo ${{ github.repository }} --title "Nyago Cargo Driver APK" --notes "Latest direct APK download for the Nyago Cargo driver app."
          gh release upload nyago-cargo-driver "driver-app/android/app/build/outputs/apk/release/app-release.apk#nyago-cargo-driver.apk" --repo ${{ github.repository }} --clobber

      - name: Upload driver release APK
        if: env.BUILD_VARIANT == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: nyago-cargo-driver-release-apk
          path: driver-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload driver debug APK
        if: env.BUILD_VARIANT != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: nyago-cargo-driver-apk
          path: driver-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
